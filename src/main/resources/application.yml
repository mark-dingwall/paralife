spring:
  application:
    name: paralife
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

paralife:
  world:
    width: 256
    height: 256
  tick:
    interval-ms: 500
    auto-start: true
  simulation:
    energy-decay-per-tick: 1
    combat-energy-transfer: 10
    nutrient-spawn-probability: 0.001
    nutrient-consume-energy: 5
    enabled: true
    overcrowding-threshold: 6
    overcrowding-energy-penalty: 2
    # Per-type metabolic profiles (Phase 13 D-02, D-03).
    # Nested under simulation.types.* so @ConfigurationProperties on MetabolicProfile
    # (prefix paralife.simulation.types) doesn't collide with SimulationConfig's flat fields.
    types:
      catalyst:
        max-energy: 80
        decay-per-tick: 3
        combat-energy-transfer: 15
        attack-power: 15
        nutrient-consume-energy: 3
        reproduce-energy-cost: 40
        reproduce-cooldown: 10
        bonus-offspring-chance: 0.0
        reproduce-range: 1
        starvation-threshold: 30
        starvation-floor: 10
      membrane:
        max-energy: 120
        decay-per-tick: 1
        combat-energy-transfer: 5
        attack-power: 5
        nutrient-consume-energy: 8
        reproduce-energy-cost: 35
        reproduce-cooldown: 8
        bonus-offspring-chance: 0.0
        reproduce-range: 1
        starvation-threshold: 25
        starvation-floor: 8
      spore:
        max-energy: 60
        decay-per-tick: 2
        combat-energy-transfer: 8
        attack-power: 8
        nutrient-consume-energy: 5
        reproduce-energy-cost: 20
        reproduce-cooldown: 5
        bonus-offspring-chance: 0.25
        reproduce-range: 2
        starvation-threshold: 35
        starvation-floor: 12
    starvation:
      max-attack-boost: 0.5
      max-nutrient-boost: 0.5
      max-damage-vulnerability: 0.5
    # Phase 13 Plan 03: fertility patches (D-13) and seasonal cycle (D-14)
    fertility:
      patch-count: 20
      patch-min-radius: 3
      patch-max-radius: 8
      max-level: 100
    seasons:
      year-length-ticks: 200
      amplitude: 0.5
    # Phase 14: environmental-rules (D-30, D-48). Four effects: lightning,
    # toxin, mutagen, corpse compost. `seed` key deliberately OMITTED — production
    # runs with unseeded Random (cycle-6 HIGH #1); tests bind via @TestPropertySource.
    events:
      enabled: true
      lightning:
        peak-season: SUMMER
        peak-lambda: 0.04
        off-season-lambda: 0.005
        inner-radius: 2
        outer-radius: 4
        damage: 40
        fertility-boost: 25
      toxin:
        peak-season: AUTUMN
        peak-lambda: 0.03
        off-season-lambda: 0.005
        path-points-min: 4
        path-points-max: 8
        path-offset-min: 5
        path-offset-max: 25
        speed: 3
        lifetime-ticks: 80
        diffusion-radius: 3
        diffusion-rate: 0.5
        decay-rate: 0.1
        splash-damage-fraction: 0.2
        base-damage: 10
        intensity-threshold: 20
        resistance:
          catalyst: 1.0
          membrane: 0.7
          spore: 1.3
      mutagen:
        peak-season: SPRING
        peak-lambda: 0.02
        off-season-lambda: 0.0025
        infection-duration-min: 20
        infection-duration-max: 30
        buff-duration-multiplier: 10
        cure-ticks: 5
        attack-cure-reduction: 3
        damage-per-tick: 2
        strain-mutation-chance: 0.1
        gossip-probability: 0.3
        zone-decay-ticks: 50
      compost:
        full-strength: 30
        half-strength: 15
  bonding:
    bond-energy-threshold: 50
    bonding-probability: 0.10
    bond-defense-chance: 0.25
    # Phase 13 Plan 02: hybrid vigor (D-05) and bond decay cost reduction (D-06) ranges
    bond-rate-bonus-min: 0.1
    bond-rate-bonus-max: 0.5
    bond-decay-cost-min: 0.6
    bond-decay-cost-max: 0.9
  composite:
    dissolution-chance: 0.03
    critical-energy-percent: 12
    speed-constant: 1.0
    locomotor-passive-drain: 1
    locomotor-active-drain: 3
    feeder-passive-drain: 1
    feeder-active-drain: 2
    attacker-passive-drain: 1
    attacker-active-drain: 4
    defender-passive-drain: 1
    reproducer-passive-drain: 1
    reproducer-active-drain: 2
    sensor-passive-drain: 1
    can-form-composites: true
