spring:
  application:
    name: paralife
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

paralife:
  world:
    width: 256
    height: 256
    rock:
      seed: 0
      density-threshold: 185
      textures:
        - /rocks/perlin-01.png
        - /rocks/perlin-02.png
        - /rocks/perlin-03.png
        - /rocks/perlin-04.png
        - /rocks/perlin-05.png
  tick:
    interval-ms: 500
    auto-start: true
  websocket:
    # Phase 15 UAT Test 7 follow-up: RFC 6455 server→client PING cadence (ticks).
    # 30 ticks × 500ms = 15s — comfortably under the idle-timeout cap below.
    keepalive-ticks: 30
    # Jetty server-side read-idle close, defensive fallback if pings fail.
    # Must be > 2 × (keepaliveTicks × tick.interval-ms).
    idle-timeout-ms: 60000
    # Phase 16 Plan 06 — per-session respawn cap (T-15-04, D-33). Previously a
    # hardcoded constant in WorldWebSocketHandler; exposed here so long-run
    # emergence tests can raise the ceiling via @TestPropertySource without
    # relaxing the production invariant. Production MUST stay at 5.
    max-respawns-per-session: 5
  # Phase 20 D-07 — runtime tuning surface. Layer 2 (jetty) and layer 3 (app).
  # See RUNTIME.md §2.
  runtime:
    # Phase 20 D-07 layer 2 — Jetty 12 WebSocket runtime tuning surface.
    # Defaults match project-current defaults — Jetty 12.0.18 defaults except
    # `idle-timeout-ms: 60000` which inherits the legacy paralife.websocket.idle-timeout-ms
    # value (Jetty's own default is 30000; Pass-2 Concern #16). Overriding any value
    # tunes that specific knob. All eight fields are [launch-only]: applied by
    # JettyRequestUpgradeStrategy.addWebSocketConfigurer at WS upgrade.
    # See docs/RUNTIME.md §2.
    jetty:
      input-buffer-size: 4096           # [launch-only] Jetty default
      output-buffer-size: 4096          # [launch-only] Jetty default
      max-frame-size: 65536             # [launch-only] default preserves Jetty's 65536 cap (T-20-DOS-1)
      max-binary-message-size: 65536    # [launch-only]
      max-text-message-size: 65536      # [launch-only]
      idle-timeout-ms: 60000            # [launch-only] project-current default (Jetty's own is 30000). Must be > 2 × (paralife.websocket.keepalive-ticks × paralife.tick.interval-ms) — defaults satisfy this. Legacy key paralife.websocket.idle-timeout-ms is honoured as one-phase fallback (case-E precedence: explicit-60000 here loses to any legacy override; see JettyDeflateCustomizer#resolveEffectiveIdleMs).
      auto-fragment: true               # [launch-only]
      max-outgoing-frames: -1           # [launch-only] -1 = unlimited (Jetty default); outbound backpressure delegated to D-10 OutboundSender queue
    # Phase 20 D-07 layer 3 — application-level tuning surface.
    # D-20: paralife.admission.backpressure.outbound-queue-size is NOT moved or
    # shadowed; this record carries SIBLING outbound knobs only.
    # Pass-2 Concern #7: ALL fields tagged [reserved — no effect in Phase 20];
    # the binding surface exists for future consumers (M5 admin UI, Phase 19.1
    # parallel encode, Phase 999.4 codec API extension).
    app:
      outbound:
        queue-watermark-pct: 80          # [reserved — no effect in Phase 20] slow-client watermark; consumer wiring deferred to M5 admin UI
        frame-size-budget-bytes: 1024    # [reserved — no effect in Phase 20] codec sizing hint; PerceptionCodec.encode(Frame) takes no capacity arg, consumer wiring deferred (Pass-2 Concern #7)
      encode:
        parallel-encode-threshold: -1    # [reserved — no effect in Phase 20] Phase 19.1 follow-up consumer; -1 = disabled
        encode-batch-hint: 8             # [reserved — no effect in Phase 20] tick-broadcast batch sizing hint; consumer wiring deferred
  admission:
    cap: 256
    maintenance: false
    tick-overload:
      high-water-pct: 80
      low-water-pct: 60
      window-ticks: 10
    backpressure:
      outbound-queue-size: 128
      grace-window-ticks: 10
    attribution:
      max-harness-cardinality: 64
  simulation:
    energy-decay-per-tick: 1
    combat-energy-transfer: 10
    nutrient-spawn-probability: 0.001
    nutrient-consume-energy: 5
    enabled: true
    overcrowding-threshold: 6
    overcrowding-energy-penalty: 2
    # Phase 16 Plan 01: nullable Long seeds. Production = unseeded; tests bind
    # explicit values via @TestPropertySource / @DynamicPropertySource.
    seed:                       # Long; null = unseeded (SimulationEngine RNG)
    action-seed:                # Long; null = unseeded (ActionResolver RNG)
    spawn:
      seed:                     # Long; null = unseeded (WorldWebSocketHandler spawn placement RNG)
    # Per-type metabolic profiles (Phase 13 D-02, D-03).
    # Nested under simulation.types.* so @ConfigurationProperties on MetabolicProfile
    # (prefix paralife.simulation.types) doesn't collide with SimulationConfig's flat fields.
    types:
      catalyst:
        max-energy: 80
        decay-per-tick: 3
        combat-energy-transfer: 15
        attack-power: 15
        nutrient-consume-energy: 3
        reproduce-energy-cost: 40
        reproduce-cooldown: 10
        bonus-offspring-chance: 0.0
        reproduce-range: 1
        starvation-threshold: 30
        starvation-floor: 10
      membrane:
        max-energy: 120
        decay-per-tick: 1
        combat-energy-transfer: 5
        attack-power: 5
        nutrient-consume-energy: 8
        reproduce-energy-cost: 35
        reproduce-cooldown: 8
        bonus-offspring-chance: 0.0
        reproduce-range: 1
        starvation-threshold: 25
        starvation-floor: 8
      spore:
        max-energy: 60
        decay-per-tick: 2
        combat-energy-transfer: 8
        attack-power: 8
        nutrient-consume-energy: 5
        reproduce-energy-cost: 20
        reproduce-cooldown: 5
        bonus-offspring-chance: 0.25
        reproduce-range: 2
        starvation-threshold: 35
        starvation-floor: 12
    starvation:
      max-attack-boost: 0.5
      max-nutrient-boost: 0.5
      max-damage-vulnerability: 0.5
    # Phase 13 Plan 03: fertility patches (D-13) and seasonal cycle (D-14)
    fertility:
      patch-count: 20
      patch-min-radius: 3
      patch-max-radius: 8
      max-level: 100
      seed:                   # Phase 16 Plan 01: Long; null = unseeded (FertilityInitializer RNG)
    seasons:
      year-length-ticks: 200
      amplitude: 0.5
    # Phase 14: environmental-rules (D-30, D-48). Four effects: lightning,
    # toxin, mutagen, corpse compost. `seed` key deliberately OMITTED — production
    # runs with unseeded Random (cycle-6 HIGH #1); tests bind via @TestPropertySource.
    events:
      enabled: true
      lightning:
        peak-season: SUMMER
        peak-lambda: 0.04
        off-season-lambda: 0.005
        inner-radius: 2
        outer-radius: 4
        damage: 40
        fertility-boost: 25
        # Plan 15-08 Task 2 (SCHEMA §8.3 D-50 #9): FLEEING effect duration in ticks.
        # Survivors in the outer damage radius flee for this many ticks after a strike.
        fleeing-ticks: 8
      toxin:
        peak-season: AUTUMN
        peak-lambda: 0.03
        off-season-lambda: 0.005
        path-points-min: 4
        path-points-max: 8
        path-offset-min: 5
        path-offset-max: 25
        speed: 3
        lifetime-ticks: 80
        diffusion-radius: 3
        diffusion-rate: 0.5
        decay-rate: 0.1
        splash-damage-fraction: 0.2
        base-damage: 10
        intensity-threshold: 20
        resistance:
          catalyst: 1.0
          membrane: 0.7
          spore: 1.3
      mutagen:
        peak-season: SPRING
        peak-lambda: 0.02
        off-season-lambda: 0.0025
        infection-duration-min: 20
        infection-duration-max: 30
        buff-duration-multiplier: 10
        cure-ticks: 5
        attack-cure-reduction: 3
        damage-per-tick: 2
        strain-mutation-chance: 0.1
        gossip-probability: 0.3
        zone-decay-ticks: 50
        outbreak-lifetime-ticks: 300
        # The bloom gossips outward for a random grow-ticks-min..max ticks, then the
        # front freezes. This is the natural size cap (replaced the old max-radius
        # square): at gossip-probability 0.3 the front advances ~0.3 cells/tick, so
        # 30..60 ticks => a ragged blob ~9..18 cells across.
        grow-ticks-min: 30
        grow-ticks-max: 60
      compost:
        full-strength: 30
        half-strength: 15
  bonding:
    bond-energy-threshold: 50
    bonding-probability: 0.10
    bond-defense-chance: 0.25
    # Phase 13 Plan 02: hybrid vigor (D-05) and bond decay cost reduction (D-06) ranges
    bond-rate-bonus-min: 0.1
    bond-rate-bonus-max: 0.5
    bond-decay-cost-min: 0.6
    bond-decay-cost-max: 0.9
  composite:
    dissolution-chance: 0.03
    critical-energy-percent: 12
    speed-constant: 1.0
    locomotor-passive-drain: 1
    locomotor-active-drain: 3
    feeder-passive-drain: 1
    feeder-active-drain: 2
    attacker-passive-drain: 1
    attacker-active-drain: 4
    defender-passive-drain: 1
    reproducer-passive-drain: 1
    reproducer-active-drain: 2
    sensor-passive-drain: 1
    can-form-composites: true
    seed:                     # Phase 16 Plan 01: Long; null = unseeded (CompositeEnergyDistributor RNG)
  observer:
    enabled: false
    max-sessions: 4
