name: CI

# Gate workflow: runs the full JUnit suite on every push to main and every PR.
# The suite runs under the build's default forkEvery=0 (one shared JVM) — fast,
# and leak-sensitive by design (see build.gradle.kts). This job reflects realistic
# runner conditions (no core pinning); the flake-hunting stress sweep lives in
# stress.yml (manual workflow_dispatch).
on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Spotless ratchetFrom(origin/main) can resolve the base

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Lint (Spotless) + test suite (forkEvery=0)
        # One Gradle invocation: pays JVM startup once and runs spotlessCheck
        # first, so a formatting failure fails fast before the long test suite.
        run: ./gradlew spotlessCheck test --no-daemon --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
